name: CI

on:
  # push トリガは停止中（CI 全停止維持）。再有効化時に戻す:
  #   push:
  #     branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test
      # 座標ゲート。測られてへん座標がここで落ちる。
      - run: pnpm validate:coords
      # 再生成で left.json の並びや手修正座標が変わったら落とす（#97）
      - run: pnpm derive:left && git diff --exit-code src/core/data/regions/left.json
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Cloudflare Pages。secrets が無い環境（fork の PR 等）では黙って飛ばす。
  # main は本番、PR はブランチ名付きの preview URL になる。
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: env.CF_TOKEN != ''
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: env.CF_TOKEN != ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.CF_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CF_TOKEN != ''
      - run: pnpm build
        if: env.CF_TOKEN != ''
      # 初回だけ project が要る。二度目以降は「already exists」で落ちるので握る
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        if: env.CF_TOKEN != ''
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create equus-anatomy --production-branch=main
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        id: pages-deploy
        if: env.CF_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=equus-anatomy --branch=${{ github.head_ref || github.ref_name }}
      # デプロイ後の実 URL で public/ 由来の物（プライバシーポリシー・OGP 画像）が 200 か確かめる。
      # Pages は .html 付きを拡張子無しへ 308 するので -L で追う。
      - name: smoke check deployed static files
        if: env.CF_TOKEN != '' && steps.pages-deploy.outputs.deployment-url != ''
        env:
          DEPLOY_URL: ${{ steps.pages-deploy.outputs.deployment-url }}
        run: |
          set -eu
          for path in / /privacy-policy /privacy-policy.html /og-image.jpg; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "${DEPLOY_URL%/}${path}")
            echo "${path} -> ${code}"
            test "$code" = 200
          done
          curl -sSL "${DEPLOY_URL%/}/" | grep -q 'property="og:image"'
