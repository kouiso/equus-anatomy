name: CI

on:
  push:
    branches: [main]
  pull_request:
    # 既定 types には ready_for_review と converted_to_draft が無い。draft→ready で再走し、
    # ready→draft で実行中の run を concurrency に取り消させるため列挙
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# 同一 workflow・同 ref の二重起動を潰す。main push は取り消さない
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # draft PR では走らない（ready_for_review で再走）。push は pull_request が null なので
    # 前段の event_name 判定で素通し
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shared CI entry contracts
        run: node --test .github/ci/run.test.mjs
      - name: Shared web verification
        run: node .github/ci/run.mjs verify-full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Cloudflare Pages。secrets が無い環境（fork の PR 等）では黙って飛ばす。
  # main は本番、PR はブランチ名付きの preview URL になる。
  deploy:
    needs: verify
    # draft ガードは verify 側にある（needs 経由でここも止まる）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.CF_TOKEN != ''
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: env.CF_TOKEN != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: env.CF_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CF_TOKEN != ''
      - run: pnpm build
        if: env.CF_TOKEN != ''
      # 初回だけ project が要る。二度目以降は「already exists」で落ちるので握る
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        if: env.CF_TOKEN != ''
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create equus-anatomy --production-branch=main
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        id: pages-deploy
        if: env.CF_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=equus-anatomy --branch=${{ github.head_ref || github.ref_name }}
      # デプロイ後の実 URL で public/ 由来の物（プライバシーポリシー・OGP 画像）が 200 か確かめる。
      # Pages は .html 付きを拡張子無しへ 308 するので -L で追う。
      - name: smoke check deployed static files
        if: env.CF_TOKEN != '' && steps.pages-deploy.outputs.deployment-url != ''
        env:
          DEPLOY_URL: ${{ steps.pages-deploy.outputs.deployment-url }}
        run: |
          set -eu
          for path in / /privacy-policy /privacy-policy.html /og-image.jpg; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "${DEPLOY_URL%/}${path}")
            echo "${path} -> ${code}"
            test "$code" = 200
          done
          curl -sSL "${DEPLOY_URL%/}/" | grep -q 'property="og:image"'
