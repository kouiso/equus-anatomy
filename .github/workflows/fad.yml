name: FAD Distribution

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 配布するプラットフォーム
        required: true
        default: both
        type: choice
        options:
          - android
          - ios
          - both
      provision_ios:
        description: iOS の profile を match で新規作成/更新する（初回・端末追加時）
        required: false
        default: false
        type: boolean
      release_notes:
        description: テスターへ見せるリリースノート
        required: false
        default: ''
        type: string
      target:
        description: 配布先環境（stg=検証用 .stg アプリ / prod=本番。prod は main からのみ実行可）
        required: true
        default: prod
        type: choice
        options:
          - prod
          - stg

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  FAD_TARGET: ${{ inputs.target }}
  RELEASE_NOTES: ${{ inputs.release_notes || format('{0} {1}', inputs.target, github.sha) }}
  # OS ごとにグループを分ける。共通グループだと iOS しか使わん人にも Android 版の通知が届くため
  FAD_GROUP_ANDROID: 'equus-testers-android'
  FAD_GROUP_IOS: 'equus-testers-ios'
  # stg は 2026-10 に作った既存の共通グループを使う。OS 別に分けるほど人数が増えたら prod と同じ形に割る
  FAD_GROUP_STG: 'stg-testers'

jobs:
  android:
    name: Android → FAD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: inputs.platform != 'ios'
    concurrency:
      group: ${{ github.workflow }}-android
      # 配布アップロード中に次の dispatch で殺されると中途半端な状態が残るので殺さない
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Guard target + resolve FAD app
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_ANDROID_APP_ID_STG: ${{ secrets.FIREBASE_ANDROID_APP_ID_STG }}
        run: bash scripts/check-fad-config.sh android

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/equus-upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/equus-upload.jks" >> "$GITHUB_ENV"

      - name: expo prebuild (android)
        env:
          APP_VARIANT: ${{ env.FAD_TARGET }}
        run: node .github/ci/run.mjs android-prebuild

      - name: Verify applicationId matches target
        run: |
          # prebuild の生成物は Groovy の単一引用符形式 `applicationId 'x'`。
          # Kotlin DSL 移行（build.gradle.kts / `applicationId = "x"`）にも備えて両形式を許容する
          FILE=""
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && FILE="$f" && break
          done
          [ -n "$FILE" ] || { echo "android/app の build.gradle(.kts) が見つからない"; exit 1; }
          ACTUAL=$(grep -oE "applicationId *(= *)?['\"][^'\"]+['\"]" "$FILE" | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          [ "$ACTUAL" = "$EXPECTED_PACKAGE" ] || { echo "applicationId=$ACTUAL ($FILE) が target $FAD_TARGET の期待値 $EXPECTED_PACKAGE と不一致"; exit 1; }

      - name: Patch release signing
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: node .github/ci/run.mjs android-patch-signing

      - name: Build release APK (arm64 only)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node .github/ci/run.mjs android-fad-apk

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "APK が無い: $APK"; exit 1; }
          APKSIGNERS=("$ANDROID_HOME"/build-tools/*/apksigner)
          [ -x "${APKSIGNERS[-1]}" ] || { echo "apksigner が無い"; exit 1; }
          "${APKSIGNERS[-1]}" verify --print-certs "$APK" | head -5

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx -y firebase-tools@14.16.0 appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --token "$FIREBASE_TOKEN" \
            --groups "$FAD_GROUP" \
            --release-notes "$RELEASE_NOTES"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: equus-android${{ inputs.target == 'stg' && '-stg' || '' }}-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  ios:
    name: iOS → FAD
    runs-on: macos-latest
    timeout-minutes: 60
    if: inputs.platform != 'android'
    concurrency:
      group: ${{ github.workflow }}-ios
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Guard target + resolve FAD app
        env:
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_APP_ID_STG: ${{ secrets.FIREBASE_IOS_APP_ID_STG }}
        run: bash scripts/check-fad-config.sh ios

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: expo prebuild (ios) + pod install
        env:
          APP_VARIANT: ${{ env.FAD_TARGET }}
        run: |
          node .github/ci/run.mjs ios-prebuild
          # CFBundleVersion は run number で自動採番（FAD の新旧判別と App Store 移行のため）
          REL_PLIST=$(find ios -maxdepth 2 -name Info.plist -not -path "*/Pods/*" | head -1)
          [ -n "$REL_PLIST" ] || { echo "Info.plist が見つからん"; exit 1; }
          PLIST="$(cd "$(dirname "$REL_PLIST")" && pwd)/$(basename "$REL_PLIST")"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          node .github/ci/run.mjs ios-pods
          # stg 配布を本番 bundle id のまま出す事故を止める。prebuild 後の実値を照合する
          ACTUAL=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          # $(PRODUCT_BUNDLE_IDENTIFIER) 等の変数参照なら pbxproj の実値に解決する
          # shellcheck disable=SC2016  # $(VAR) という文字列そのものを探すので単一引用符は意図的
          case "$ACTUAL" in
            *'$('*)
              VAR=$(echo "$ACTUAL" | sed -E 's/.*\$\(([A-Za-z_][A-Za-z0-9_]*)\).*/\1/')
              PBX=$(find ios -maxdepth 3 -name project.pbxproj | head -1)
              ACTUAL=$(grep -m1 "^[[:space:]]*${VAR}[[:space:]]*=" "$PBX" | sed -E 's/.*=[[:space:]]*([^;]+);.*/\1/' | tr -d '[:space:]"')
              ;;
          esac
          [ "$ACTUAL" = "$EXPECTED_PACKAGE" ] || { echo "bundle id=$ACTUAL が target $FAD_TARGET の期待値 $EXPECTED_PACKAGE と不一致"; exit 1; }

      - name: Verify AsyncStorage privacy manifest is present
        run: |
          # development pod なので manifest は node_modules 側に残る
          # （ios/Pods にはコピーされない）。無いと pod 側の required-reason API
          # 宣言がバイナリに入らず App Store 提出時に ITMS-91053 でリジェクトされる
          PRIVACY=$(find node_modules -name "PrivacyInfo.xcprivacy" -path "*async-storage*" | head -1)
          [ -n "$PRIVACY" ] || { echo "AsyncStorage の PrivacyInfo.xcprivacy が無い"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSPrivacyAccessedAPITypes" "$PRIVACY" >/dev/null \
            || { echo "NSPrivacyAccessedAPITypes の宣言が無い: $PRIVACY"; exit 1; }

      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup match deploy key
        env:
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$MATCH_SSH_KEY" > ~/.ssh/equus_match_key
          chmod 600 ~/.ssh/equus_match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo 'GIT_SSH_COMMAND=ssh -i ~/.ssh/equus_match_key -o IdentitiesOnly=yes' >> "$GITHUB_ENV"

      - name: Build signed IPA via fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          if [ "${{ inputs.provision_ios }}" = "true" ]; then
            bundle exec fastlane ios fad provision:true stg:${{ inputs.target == 'stg' }}
          else
            bundle exec fastlane ios fad stg:${{ inputs.target == 'stg' }}
          fi

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx -y firebase-tools@14.16.0 appdistribution:distribute \
            build/ios/equus-anatomy.ipa \
            --app "$FIREBASE_IOS_APP_ID" \
            --token "$FIREBASE_TOKEN" \
            --groups "$FAD_GROUP" \
            --release-notes "$RELEASE_NOTES"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: equus-ios${{ inputs.target == 'stg' && '-stg' || '' }}-adhoc.ipa
          path: build/ios/equus-anatomy.ipa
          retention-days: 14
