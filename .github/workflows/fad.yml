name: FAD Distribution

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 配布するプラットフォーム
        required: true
        default: both
        type: choice
        options:
          - android
          - ios
          - both
      provision_ios:
        description: iOS の profile を match で新規作成/更新する（初回・端末追加時）
        required: false
        default: false
        type: boolean
      release_notes:
        description: テスターへ見せるリリースノート
        required: false
        default: ''
        type: string
      target:
        description: "配布先環境 stg|prod（省略時はブランチから自動判定： develop→stg, main→prod）"
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # develop=STG, main=PROD。target 入力があればそれを優先するが、
  # ref との整合は Setup ジョブで強制する（STG ビルドが PROD 受信者へ流れないための二重化）
  FAD_TARGET: ${{ inputs.target != '' && inputs.target || (github.ref_name == 'develop' && 'stg' || 'prod') }}
  FAD_GROUP: ${{ (inputs.target != '' && inputs.target || (github.ref_name == 'develop' && 'stg' || 'prod')) == 'stg' && 'stg-testers' || 'beta-testers' }}
  RELEASE_NOTES: ${{ inputs.release_notes || format('{0} {1}', (inputs.target != '' && inputs.target || (github.ref_name == 'develop' && 'stg' || 'prod')), github.sha) }}

jobs:
  android:
    name: Android → FAD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: inputs.platform != 'ios'
    concurrency:
      group: ${{ github.workflow }}-android
      # 配布アップロード中に次の dispatch で殺されると中途半端な状態が残るので殺さない
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Guard ref↔target + app id resolve
        env:
          FIREBASE_ANDROID_APP_ID_STG: ${{ secrets.FIREBASE_ANDROID_APP_ID_STG }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: bash scripts/check-fad-config.sh android

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/equus-upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/equus-upload.jks" >> "$GITHUB_ENV"

      - name: expo prebuild (android)
        env:
          APP_VARIANT: ${{ env.FAD_TARGET }}
        run: pnpm expo prebuild --platform android --no-install

      - name: Verify applicationId matches target
        run: |
          ACTUAL=$(grep -o 'applicationId "[^"]*"' android/app/build.gradle | head -1 | cut -d'"' -f2)
          [ "$ACTUAL" = "$EXPECTED_PACKAGE" ] || { echo "applicationId=$ACTUAL が target $FAD_TARGET の期待値 $EXPECTED_PACKAGE と不一致"; exit 1; }

      - name: Patch release signing
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: pnpm tsx scripts/patch-android-signing.ts

      - name: Build release APK (arm64 only)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "APK が無い: $APK"; exit 1; }
          APKSIGNERS=("$ANDROID_HOME"/build-tools/*/apksigner)
          [ -x "${APKSIGNERS[-1]}" ] || { echo "apksigner が無い"; exit 1; }
          "${APKSIGNERS[-1]}" verify --print-certs "$APK" | head -5

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx -y firebase-tools@14.16.0 appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --token "$FIREBASE_TOKEN" \
            --groups "$FAD_GROUP" \
            --release-notes "$RELEASE_NOTES"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: equus-android-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  ios:
    name: iOS → FAD
    runs-on: macos-latest
    timeout-minutes: 60
    if: inputs.platform != 'android'
    concurrency:
      group: ${{ github.workflow }}-ios
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Guard ref↔target + app id resolve
        env:
          FIREBASE_IOS_APP_ID_STG: ${{ secrets.FIREBASE_IOS_APP_ID_STG }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: bash scripts/check-fad-config.sh ios

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: expo prebuild (ios) + pod install
        run: |
          pnpm expo prebuild --platform ios --no-install
          # CFBundleVersion は run number で自動採番（FAD の新旧判別と App Store 移行のため）
          REL_PLIST=$(find ios -maxdepth 2 -name Info.plist -not -path "*/Pods/*" | head -1)
          [ -n "$REL_PLIST" ] || { echo "Info.plist が見つからん"; exit 1; }
          # cd ios 後も参照できるよう絶対パス化
          PLIST="$(cd "$(dirname "$REL_PLIST")" && pwd)/$(basename "$REL_PLIST")"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          (cd ios && pod install)
          ACTUAL=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          # $(PRODUCT_BUNDLE_IDENTIFIER) 等の変数参照なら pbxproj の実値に解決する
          case "$ACTUAL" in
            *'$('*)
              VAR=$(echo "$ACTUAL" | sed -E 's/.*\$\(([A-Za-z_][A-Za-z0-9_]*)\).*/\1/')
              PBX=$(find ios -maxdepth 3 -name project.pbxproj | head -1)
              ACTUAL=$(grep -m1 "^[[:space:]]*$VAR[[:space:]]*=" "$PBX" | sed -E 's/.*=[[:space:]]*([^;]+);.*/\1/' | tr -d '[:space:]')
              ;;
          esac
          [ "$ACTUAL" = "$EXPECTED_PACKAGE" ] || { echo "bundle id=$ACTUAL が target $FAD_TARGET の期待値 $EXPECTED_PACKAGE と不一致"; exit 1; }
        env:
          APP_VARIANT: ${{ env.FAD_TARGET }}

      - name: Verify AsyncStorage privacy manifest is present
        run: |
          # development pod なので manifest は node_modules 側に残る
          # （ios/Pods にはコピーされない）。無いと pod 側の required-reason API
          # 宣言がバイナリに入らず App Store 提出時に ITMS-91053 でリジェクトされる
          PRIVACY=$(find node_modules -name "PrivacyInfo.xcprivacy" -path "*async-storage*" | head -1)
          [ -n "$PRIVACY" ] || { echo "AsyncStorage の PrivacyInfo.xcprivacy が無い"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSPrivacyAccessedAPITypes" "$PRIVACY" >/dev/null \
            || { echo "NSPrivacyAccessedAPITypes の宣言が無い: $PRIVACY"; exit 1; }

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup match deploy key
        env:
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$MATCH_SSH_KEY" > ~/.ssh/equus_match_key
          chmod 600 ~/.ssh/equus_match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo 'GIT_SSH_COMMAND=ssh -i ~/.ssh/equus_match_key -o IdentitiesOnly=yes' >> "$GITHUB_ENV"

      - name: Build signed IPA via fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          if [ "${{ inputs.provision_ios }}" = "true" ]; then
            bundle exec fastlane ios fad provision:true stg:${{ env.FAD_TARGET == 'stg' }}
          else
            bundle exec fastlane ios fad stg:${{ env.FAD_TARGET == 'stg' }}
          fi

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx -y firebase-tools@14.16.0 appdistribution:distribute \
            build/ios/equus-anatomy.ipa \
            --app "$FIREBASE_IOS_APP_ID" \
            --token "$FIREBASE_TOKEN" \
            --groups "$FAD_GROUP" \
            --release-notes "$RELEASE_NOTES"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: equus-ios-adhoc.ipa
          path: build/ios/equus-anatomy.ipa
          retention-days: 14
