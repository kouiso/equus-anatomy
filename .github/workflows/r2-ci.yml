name: r2-ci

# r2-gallery 本体の CI。r2-gallery の Actions はランナーが起動せず全ジョブが 0 ステップで
# 落ちる（kouiso/r2-gallery#120）ので、public のこのリポから r2-gallery の ci.yml と同じ
# check / test / secrets-scan を回す。r2-flutter-build と同じく cron で main と PR の head を見て、
# まだ検査していない SHA だけ回す。結果は r2-gallery の commit status「equus/r2-ci」と
# r2-gallery の r2-ci-state 枝（results/<sha>）に残す。
on:
  workflow_dispatch:
    inputs:
      target:
        description: 検査し直す対象。main か PR 番号（例 154）。空なら未検査の main と PR 全部
        required: false
        default: ""
  schedule:
    - cron: "12,27,42,57 * * * *"
  # このファイル自体を変えた時はすぐ1回回す。GitHub の cron は登録直後や混雑時に数十分遅れるため
  push:
    branches: [main]
    paths: [.github/workflows/r2-ci.yml]

permissions:
  contents: read

# 同じ SHA を二重に検査して state 枝へ同時に書かんよう直列化する
concurrency:
  group: r2-ci
  cancel-in-progress: false

env:
  R2G_REPO: kouiso/r2-gallery
  STATE_BRANCH: r2-ci-state
  STATUS_CONTEXT: equus/r2-ci

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: List unchecked main / PR heads
        id: plan
        env:
          PAT: ${{ secrets.R2G_PAT }}
          TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          repo, pat = os.environ["R2G_REPO"], os.environ["PAT"]
          target = (os.environ.get("TARGET") or "").strip()

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={"Authorization": f"Bearer {pat}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          main = api("commits/main")["sha"]
          targets = [{"kind": "main", "label": "main", "sha": main, "fetch": "refs/heads/main", "base_ref": "", "base_sha": ""}]
          for pr in api("pulls?state=open&per_page=50"):
              # r2-gallery の ci.yml と同じく draft は回さない（ready にした時の head を回す）
              if pr["draft"] and target != str(pr["number"]):
                  continue
              targets.append({
                  "kind": "pr",
                  "label": f"#{pr['number']}",
                  "sha": pr["head"]["sha"],
                  "fetch": f"refs/pull/{pr['number']}/head",
                  "base_ref": pr["base"]["ref"],
                  "base_sha": pr["base"]["sha"],
              })

          if target:
              want = "main" if target == "main" else f"#{target.lstrip('#')}"
              targets = [t for t in targets if t["label"] == want]
              if not targets:
                  raise SystemExit(f"{target} は r2-gallery の main でも open な PR でもない")
          else:
              try:
                  done = {e["name"] for e in api(f"contents/results?ref={os.environ['STATE_BRANCH']}")}
              except urllib.error.HTTPError as e:
                  # state 枝か results/ がまだ無い（初回）時だけ全部を未検査として扱う
                  if e.code != 404:
                      raise
                  done = set()
              targets = [t for t in targets if t["sha"] not in done]

          # 1 回の run で回す数を絞る。残りは次の cron が拾う
          targets = targets[:8]
          for t in targets:
              print(f"check {t['label']} {t['sha']}")
          if not targets:
              print("未検査の main / PR head は無い")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"targets={json.dumps(targets)}\n")
          PY

  check:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    name: check ${{ matrix.target.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - name: Mark pending on r2-gallery
        env:
          PAT: ${{ secrets.R2G_PAT }}
          SHA: ${{ matrix.target.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$R2G_REPO/statuses/$SHA" \
            -d "{\"state\":\"pending\",\"context\":\"$STATUS_CONTEXT\",\"target_url\":\"$RUN_URL\",\"description\":\"equus で検査中\"}")
          # status は PR に結果を出すための窓口で、記録の正本は state 枝。書けん時は理由を残して進む
          if [ "$code" != "201" ]; then echo "::warning::commit status を書けへん (HTTP $code)。結果は $STATE_BRANCH 枝にだけ残る"; fi

      - name: Fetch only the target ref
        env:
          PAT: ${{ secrets.R2G_PAT }}
          FETCH: ${{ matrix.target.fetch }}
          BASE_REF: ${{ matrix.target.base_ref }}
          SHA: ${{ matrix.target.sha }}
        run: |
          # トークンは .git/config に残さない。この後のステップでは r2-gallery のコード（テスト等）を動かすため
          git init -q r2g
          cd r2g
          git remote add origin "https://github.com/$R2G_REPO.git"
          auth() { git -c credential.helper= -c "credential.helper=!f() { echo username=x-access-token; echo password=\$PAT; }; f" "$@"; }
          refs=("+$FETCH:refs/remotes/origin/target")
          # PR は gitleaks の差分範囲（base^..head）を引けるよう base 枝も取る
          if [ -n "$BASE_REF" ]; then refs+=("+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"); fi
          auth fetch -q --no-tags origin "${refs[@]}"
          git checkout -q --detach "$SHA"
          git log -1 --format='%H %s'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: check / test / secrets-scan
        id: ci
        working-directory: r2g
        env:
          CI_SCAN_BASE: ${{ matrix.target.base_sha }}
          CI_SCAN_HEAD: ${{ matrix.target.sha }}
          QN_FORBIDDEN_WORDS: ${{ secrets.QN_FORBIDDEN_WORDS }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          if [ -z "$QN_FORBIDDEN_WORDS" ]; then
            echo "::warning::equus に QN_FORBIDDEN_WORDS が無いので禁止語の検査は飛ぶ"
          fi
          # r2-gallery の ci.yml の 3 ジョブと同じコマンド。1 つ落ちても残りを回し、落ちた所を全部出す
          failed=()
          phase() { echo "::group::$1"; if "${@:2}"; then echo "::endgroup::"; else echo "::endgroup::"; echo "::error::$1 が落ちた"; failed+=("$1"); fi; }
          phase "contracts" node --test .github/ci/run.test.mjs
          phase "check" node .github/ci/run.mjs check
          phase "ai-rules" node tools/sync-ai-rules.mjs --check
          phase "test" node .github/ci/run.mjs test
          phase "gitleaks" node .github/ci/run.mjs gitleaks
          phase "hygiene" node .github/ci/run.mjs hygiene
          if [ ${#failed[@]} -gt 0 ]; then
            echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Report to r2-gallery
        if: always()
        env:
          PAT: ${{ secrets.R2G_PAT }}
          SHA: ${{ matrix.target.sha }}
          LABEL: ${{ matrix.target.label }}
          OUTCOME: ${{ steps.ci.outcome }}
          FAILED: ${{ steps.ci.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$OUTCOME" in
            success) STATE=success; DESC="check / test / secrets-scan 全部通った" ;;
            failure) STATE=failure; DESC="落ちた: ${FAILED:-取得か準備の段階}" ;;
            *) STATE=error; DESC="検査が最後まで回らんかった ($OUTCOME)" ;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$R2G_REPO/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"$STATUS_CONTEXT\",\"target_url\":\"$RUN_URL\",\"description\":\"$DESC\"}")
          if [ "$code" != "201" ]; then echo "::warning::commit status を書けへん (HTTP $code)。結果は $STATE_BRANCH 枝にだけ残る"; fi

          # 途中で取り消された run は記録せん。次の cron がもう一度回す
          if [ "$STATE" = "error" ]; then exit 0; fi
          git init -q state
          cd state
          git remote add origin "https://github.com/$R2G_REPO.git"
          auth() { git -c credential.helper= -c "credential.helper=!f() { echo username=x-access-token; echo password=\$PAT; }; f" "$@"; }
          # state 枝の commit は noreply にする。r2-gallery の leak-check は個人の email を落とすため
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # matrix の各脚が同じ枝へ書くので、取り直して積み直す
          for attempt in 1 2 3 4 5; do
            if auth fetch -q --depth 1 origin "$STATE_BRANCH"; then
              git checkout -q -B "$STATE_BRANCH" FETCH_HEAD
            else
              git checkout -q --orphan "$STATE_BRANCH"
            fi
            mkdir -p results
            printf '%s %s %s\n' "$STATE" "$LABEL" "$RUN_URL" > "results/$SHA"
            git add results
            git diff --cached --quiet || git commit -qm "r2-ci: $STATE $LABEL $SHA"
            if auth push -q origin "HEAD:$STATE_BRANCH"; then echo "recorded results/$SHA = $STATE"; exit 0; fi
            git checkout -q --detach
            git branch -q -D "$STATE_BRANCH"
            sleep $((attempt * 3))
          done
          echo "::error::$STATE_BRANCH 枝へ結果を書けへんかった"
          exit 1
