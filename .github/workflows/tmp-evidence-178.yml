name: tmp-evidence-178
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  shots:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build && mv dist dist-after
      - run: |
          cp 'src/app/(tabs)/index.tsx' /tmp/after-index.tsx
          git show 6408e23:'src/app/(tabs)/index.tsx' > 'src/app/(tabs)/index.tsx'
          pnpm build && mv dist dist-before
          cp /tmp/after-index.tsx 'src/app/(tabs)/index.tsx'
      - run: |
          pnpm exec serve dist-before -l 4191 &
          pnpm exec serve dist-after -l 4192 &
          sleep 5
          pnpm exec tsx .github/tmp-evidence/shots.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-178
          path: evidence-out
          retention-days: 7
