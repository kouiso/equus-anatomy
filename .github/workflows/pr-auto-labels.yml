name: PR Auto Labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-auto-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: PR Auto Labels
    runs-on: ubuntu-latest
    # WHY: draft は途中状態なので付け直し対象から外す。ボット PR は既存の付与機構に任せる。
    if: "github.event.pull_request.draft == false && !contains(github.actor, '[bot]')"
    permissions:
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Apply labels (add only, never remove)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { labelsFor, resolveLabels } = require('./.github/script/pr-auto-labels.js');
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const wanted = labelsFor(pr.head.ref, files.map((f) => f.filename));
            if (!wanted.length) {
              core.info('no labels matched');
              return;
            }
            // WHY: 新規ラベルの作成はオーナーの恒久指示で禁止。repo 既存のものだけを付け、
            // 存在しないラベルはスキップしてログに残す。
            const { data: existing } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const { apply, skipped } = resolveLabels(wanted, existing.map((l) => l.name));
            for (const label of skipped) {
              core.info(`skipped unknown label: ${label}`);
            }
            if (!apply.length) {
              core.info('no existing labels to apply');
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: apply,
            });
            core.info(`applied: ${apply.join(', ')}`);
