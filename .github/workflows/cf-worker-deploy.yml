name: CF Worker Deploy (external repo)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: owner/repo hosting the worker
        required: true
        default: kouiso/r2-gallery
      ref:
        description: git ref to deploy from
        required: true
        default: main
      worker_dir:
        description: path to the worker directory (contains wrangler.toml)
        required: true
        default: worker

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Checkout worker repo
        env:
          GH_PAT: ${{ secrets.R2G_PAT }}
        run: |
          git clone --depth 1 --branch "${{ inputs.ref }}" \
            "https://x-access-token:${GH_PAT}@github.com/${{ inputs.repo }}.git" src

      - name: Deploy
        working-directory: src/${{ inputs.worker_dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Worker code resolves deps from the repo-root node_modules.
          (cd .. && npm install --no-save --no-audit --no-fund hono)
          npx -y wrangler@4 deploy
