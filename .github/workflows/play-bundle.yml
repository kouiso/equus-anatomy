name: Play AAB

# Google Play 用の署名済み AAB をビルドして artifact として吐く。
# 内部テスト track への upload は Play Console から手動、または
# サービスアカウント整備後に supply で自動化する想定。

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "AAB の versionCode（空なら run number。Play は昇順必須）"
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  android:
    name: Android → AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/equus-upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/equus-upload.jks" >> "$GITHUB_ENV"

      - name: expo prebuild (android)
        run: pnpm expo prebuild --platform android --no-install

      - name: Patch release signing
        env:
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        # WHY: Play は versionCode 昇順必須。store-build.yml と同じ
        # 100000 + run_number に揃えて両ワークフローの出力を連番にする
        # （GitHub 式は算術不可なので shell で計算する）
        run: |
          VC="${VERSION_CODE_INPUT:-$((100000 + GITHUB_RUN_NUMBER))}"
          echo "ANDROID_VERSION_CODE=$VC" >> "$GITHUB_ENV"
          pnpm tsx scripts/patch-android-signing.ts

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:bundleRelease --no-daemon

      - name: Verify AAB signature
        run: |
          set -o pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "AAB が無い: $AAB"; exit 1; }
          JARSIGNERS=$(find "$JAVA_HOME" -name jarsigner | head -1)
          "$JARSIGNERS" -verify -verbose -certs "$AAB" | head -5

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: equus-android-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
