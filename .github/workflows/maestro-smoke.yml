name: Maestro Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm expo prebuild --platform android --no-install

      - name: Build smoke APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Install Maestro
        env:
          MAESTRO_VERSION: '2.10.0'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test --format junit --output maestro-results.xml .maestro/smoke/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: maestro-smoke-results-android
          path: |
            maestro-results.xml
            ~/.maestro/tests
          retention-days: 14

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: expo prebuild (ios) + pod install
        run: |
          pnpm expo prebuild --platform ios --no-install
          cd ios && pod install

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Debug + Metro だと起動のたびに JS を Metro から読み、初回は 30 秒を超えて
      # 最初のフローが「Loading from Metro...」のまま落ちる。Android と同じく
      # JS 同梱の Release で焼いて Metro を外す。
      - name: Build app for simulator (Release, JS bundled)
        run: |
          SIM_ID=$(xcrun simctl create "equus-maestro" "iPhone 16" 2>/dev/null || xcrun simctl create "equus-maestro" "iPhone 15")
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID" || true
          xcodebuild -workspace ios/EQUUS.xcworkspace -scheme EQUUS \
            -configuration Release -destination "id=$SIM_ID" \
            -derivedDataPath ios/dd build

      - name: Install app + run Maestro flows
        run: |
          APP=$(find ios/dd/Build/Products/Release-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          xcrun simctl install "$SIM_ID" "$APP"
          maestro test -p ios --device "$SIM_ID" --format junit --output maestro-results-ios.xml .maestro/smoke/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: maestro-smoke-results-ios
          path: |
            maestro-results-ios.xml
            ~/.maestro/tests
          retention-days: 14
