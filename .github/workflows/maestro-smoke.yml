name: Maestro Smoke

# Android は日次、iOS (macOS 90 分枠) は週次。dispatch は両方走る。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
    - cron: '30 18 * * 0'

# ref と schedule 毎に分ける。global group だと PR からの dispatch が main の定期実行を
# cancel し、日曜の Android と iOS の cron 同士も潰し合うため
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: true

jobs:
  android-emulator:
    if: github.event.schedule != '30 18 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node .github/ci/run.mjs android-prebuild

      - name: Build smoke APK
        run: |
          node .github/ci/run.mjs android-smoke-apk

      - name: Install Maestro
        env:
          MAESTRO_VERSION: '2.10.0'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test --format junit --output maestro-results.xml .maestro/smoke/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: maestro-smoke-results-android
          path: |
            maestro-results.xml
            ~/.maestro/tests
          retention-days: 14

  ios-simulator:
    if: github.event_name != 'schedule' || github.event.schedule == '30 18 * * 0'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: expo prebuild (ios) + pod install
        run: |
          node .github/ci/run.mjs ios-prebuild
          node .github/ci/run.mjs ios-pods

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Debug + Metro だと起動のたびに JS を Metro から読み、初回は 30 秒を超えて
      # 最初のフローが「Loading from Metro...」のまま落ちる。Android と同じく
      # JS 同梱の Release で焼いて Metro を外す。
      - name: Build app for simulator (Release, JS bundled)
        run: |
          SIM_ID=$(xcrun simctl create "equus-maestro" "iPhone 16" 2>/dev/null || xcrun simctl create "equus-maestro" "iPhone 15")
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID" || true
          SIM_ID="$SIM_ID" node .github/ci/run.mjs ios-smoke-build

      - name: Install app + run Maestro flows
        run: |
          APP=$(find ios/dd/Build/Products/Release-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          xcrun simctl install "$SIM_ID" "$APP"
          maestro test -p ios --device "$SIM_ID" --format junit --output maestro-results-ios.xml .maestro/smoke/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: maestro-smoke-results-ios
          path: |
            maestro-results-ios.xml
            ~/.maestro/tests
          retention-days: 14
