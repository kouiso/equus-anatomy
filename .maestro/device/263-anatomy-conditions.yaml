appId: jp.co.ritmo.equusanatomy
name: "#263 解剖画面 — 層・向き・深さのチップで、図の枠を動かさず条件を切り替えられる"
---
# 受け入れの観点（#263）: チップの押しやすさ / 押しても図が動かない / 文字拡大時の欄内スクロール。
# 図の枠が動かないかは、前後の takeScreenshot を同じ条件で並べて人が見る（Maestro は座標の差を取れない）。
# 文字拡大は端末の設定なので、この flow の2周目として端末側で「文字サイズ最大」にして同じ flow を回す（README 参照）。
# 表示条件の別画面（overlay）は開かない。チップは解剖画面の説明欄に直接ある（#288）。
- runFlow: common/launch-ja.yaml
- takeScreenshot: 263-0-initial

# --- 何も選んでいない時: 層・向きのチップが10個、深さは筋肉の時だけ出る ---
# 欄に収まらない端末では、欄の中だけをスクロールして届かせる（図の上で swipe すると図が動くので、起点を欄に固定する）
- runFlow:
    when:
      notVisible:
        id: chip-deep
    commands:
      - swipe:
          from:
            id: anatomy-panel-scroll
          direction: UP
- assertVisible:
    id: chip-skin
- assertVisible:
    id: chip-muscle
- assertVisible:
    id: chip-skeleton
- assertVisible:
    id: chip-organs
- assertVisible:
    id: chip-left
- assertVisible:
    id: chip-right
- assertVisible:
    id: chip-front
- assertVisible:
    id: chip-rear
- assertVisible:
    id: chip-superficial
- assertVisible:
    id: chip-deep
# 初期は 左側望 · 筋肉 · 表層筋（説明欄の1行がその状態を字で言う）
- assertVisible: "左側望 · 筋肉 · 表層筋"
- takeScreenshot: 263-1-chips-all

# --- 層: 骨格を押すと、その場で図が替わり、深さのチップは消える ---
- tapOn:
    id: chip-skeleton
- assertVisible: "左側望 · 骨格"
- assertNotVisible:
    id: chip-superficial
- assertNotVisible:
    id: chip-deep
# 表示条件の別画面へ移っていない
- assertNotVisible:
    id: overlay-close
- assertVisible:
    id: zoom-in
- takeScreenshot: 263-2-skeleton
- tapOn:
    id: chip-muscle
- assertVisible: "左側望 · 筋肉 · 表層筋"
- takeScreenshot: 263-3-muscle-again

# --- 深さ: 絵の無い深層筋のチップは押せず、字で「図なし」と分かる ---
- assertVisible:
    id: chip-deep
    enabled: false
- assertVisible:
    id: chip-deep
    text: "深層筋（図なし）"
- tapOn:
    id: chip-deep
- assertVisible: "左側望 · 筋肉 · 表層筋"
- takeScreenshot: 263-4-deep-disabled

# --- 層を替えても、選んでいる場所は残る ---
- tapOn: "場所・部位一覧"
- tapOn: "頭部"
- assertVisible:
    id: step-back
- assertVisible: "1つ戻る：場所の選択を解除して全体図に戻る"
- takeScreenshot: 263-5-area-selected
- tapOn:
    id: chip-skeleton
- assertVisible: "左側望 · 骨格"
- assertVisible:
    id: step-back
- assertVisible: "1つ戻る：場所の選択を解除して全体図に戻る"
- takeScreenshot: 263-6-skeleton-keeps-area
- tapOn:
    id: chip-muscle

# --- 向き: 正面を押すと図が替わり、場所は外れる（今の動きのまま） ---
- tapOn:
    id: chip-front
- assertVisible: ".*正面.*"
- assertNotVisible:
    id: step-back
- assertNotVisible:
    id: overlay-close
- takeScreenshot: 263-7-front
- tapOn:
    id: chip-left
- assertVisible: "左側望 · 筋肉 · 表層筋"

# --- 部位を選んでいる間は、チップを出さず名前と操作を先に見せる（縦長の画面） ---
- tapOn: "場所・部位一覧"
- tapOn: "頭部"
- tapOn: "部位一覧"
- scrollUntilVisible:
    element:
      text: "咬筋"
    direction: DOWN
- tapOn: "咬筋"
- assertVisible:
    id: close-sheet
- assertNotVisible:
    id: chip-skeleton
- takeScreenshot: 263-8-part-selected-no-chips
- tapOn:
    id: close-sheet
- assertNotVisible:
    id: close-sheet
- assertVisible:
    id: chip-skeleton
- takeScreenshot: 263-9-deselected-chips-back
