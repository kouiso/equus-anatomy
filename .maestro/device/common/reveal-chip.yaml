appId: jp.co.ritmo.equusanatomy
---
# 説明欄（anatomy-panel-scroll）の中だけをスクロールして、チップ ${CHIP} を見える所へ出す。
# 図の上で swipe すると図が動くので、起点は必ず欄に固定する。画面の大きさ・文字拡大に左右されないよう、
# 見えている間は何もせず、見えない時だけ「DOWN を1回（上端側へ戻す）→ UP を2回（下へ送る）」の最大3回のスワイプで探す。
# 呼び出し側が env で CHIP（例: chip-skeleton）を渡す。
- runFlow:
    when:
      notVisible:
        id: ${CHIP}
    commands:
      - swipe:
          from:
            id: anatomy-panel-scroll
          direction: DOWN
- runFlow:
    when:
      notVisible:
        id: ${CHIP}
    commands:
      - swipe:
          from:
            id: anatomy-panel-scroll
          direction: UP
- runFlow:
    when:
      notVisible:
        id: ${CHIP}
    commands:
      - swipe:
          from:
            id: anatomy-panel-scroll
          direction: UP
