appId: jp.co.ritmo.equusanatomy
name: ズーム — ＋/−/全体に戻る ボタンで落ちずに図へ戻れる
---
# 端末の言語が英語だと以降の日本語アサートが全部落ちるので、先に日本語へ揃える。
- retry:
    maxRetries: 1
    interval: 2000
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            id: zoom-in
          timeout: 30000
- tapOn:
    text: 日本語
    optional: true
- takeScreenshot: zoom-fit
- tapOn:
    id: zoom-in
- tapOn:
    id: zoom-in
- takeScreenshot: zoom-in-x2
- tapOn:
    id: zoom-out
- takeScreenshot: zoom-out-x1
- tapOn:
    id: zoom-reset
- assertVisible:
    id: anatomy-panel
- assertVisible: "表示条件"
- takeScreenshot: zoom-reset
