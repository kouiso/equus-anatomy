appId: jp.co.ritmo.equusanatomy
name: 覚えた — 図鑑の詳細で覚えたをオン・オフし、件数に反映される
---
# 端末の言語が英語だと以降の日本語アサートが全部落ちるので、先に日本語へ揃える。
- retry:
    maxRetries: 1
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            id: tab-catalog
          timeout: 30000
# EN起動時のみ: 'Choose a general area'(EN専用文字列)が見える時だけ言語トグルをidで押してJAへ揃える。
# iOSではa11yラベル(Switch to Japanese...)だけが公開され '日本語' の部分一致は届かないため id を使う。
- runFlow:
    when:
      visible:
        text: Choose a general area
    commands:
      - tapOn:
          id: language-toggle
- extendedWaitUntil:
    visible:
      text: 解剖
    timeout: 10000
- tapOn:
    id: tab-catalog
- assertVisible:
    id: mastery-count
    text: "覚えた 0 / \\d+"
# Android の inputText は ASCII しか打てないので英名で引く
- tapOn:
    id: catalog-search
- inputText: "liver"
- tapOn:
    id: catalog-row-organ-liver
- assertVisible:
    id: detail-name-ja
    text: "肝臓"
- assertVisible:
    id: mastery-toggle
    text: "覚えたにする"
- tapOn:
    id: mastery-toggle
- assertVisible:
    id: mastery-toggle
    text: "覚えた"
- tapOn:
    id: catalog-back
- assertVisible:
    id: mastery-count
    text: "覚えた 1 / \\d+"
- takeScreenshot: mastery-on
- tapOn:
    id: catalog-row-organ-liver
- tapOn:
    id: mastery-toggle
- assertVisible:
    id: mastery-toggle
    text: "覚えたにする"
- tapOn:
    id: catalog-back
- assertVisible:
    id: mastery-count
    text: "覚えた 0 / \\d+"
