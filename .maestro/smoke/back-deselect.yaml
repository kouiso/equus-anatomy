appId: jp.co.ritmo.equusanatomy
name: 端末 BACK — 部位 → 場所の順に選択を一段ずつ解除し、アプリは閉じない
---
# 端末の言語が英語だと以降の日本語アサートが全部落ちるので、先に日本語へ揃える。
# clear→再launch直後にプロセスが kill される競合(#158 CI実測)対策として起動と readiness をまとめて1回だけ再試行する。
- retry:
    maxRetries: 1
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            id: anatomy-panel
          timeout: 30000
# EN起動時のみ: 'Choose a general area'(EN専用文字列)が見える時だけ言語トグルをidで押してJAへ揃える。
# iOSではa11yラベル(Switch to Japanese...)だけが公開され '日本語' の部分一致は届かないため id を使う。
- runFlow:
    when:
      visible:
        text: Choose a general area
    commands:
      - tapOn:
          id: language-toggle
- extendedWaitUntil:
    visible:
      text: 解剖
    timeout: 10000
- tapOn: "場所・部位一覧"
- tapOn: "頭部"
- assertVisible:
    id: step-back
- tapOn: "部位一覧"
- scrollUntilVisible:
    element:
      text: "咬筋"
    direction: DOWN
- tapOn: "咬筋"
- assertVisible:
    id: close-sheet
- assertVisible:
    id: deselect-hint
- takeScreenshot: back-0-part-selected
# 1 回目: 「1つ戻る」チップ自体を両OSで実押し — 部位だけ外れて、場所（頭部）は残る。
- tapOn:
    id: step-back
- assertNotVisible:
    id: close-sheet
- assertVisible:
    id: step-back
- takeScreenshot: back-1-part-cleared
# 2 回目: 場所も外れて全体図に戻る。アプリは前面のまま。
# Android は端末 BACK の別ケースとして残し、iOS は端末 BACK が無いのでチップを押す。
- runFlow:
    when:
      platform: android
    commands:
      - back
- runFlow:
    when:
      platform: ios
    commands:
      - tapOn:
          id: step-back
- assertNotVisible:
    id: step-back
- assertVisible:
    id: anatomy-panel
- assertVisible: "大まかな場所を選んでください"
- takeScreenshot: back-2-area-cleared
# 3 回目: 寄りだけの状態からもチップを実押し — 寄りを解除して全体図に戻る
- tapOn:
    id: zoom-in
- assertVisible:
    id: step-back
- takeScreenshot: back-3-zoomed
- tapOn:
    id: step-back
- assertNotVisible:
    id: step-back
- assertVisible:
    id: anatomy-panel
- assertVisible: "大まかな場所を選んでください"
- takeScreenshot: back-4-zoom-cleared
