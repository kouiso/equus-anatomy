appId: app.r2gallery
---
# 上書き更新の前の状態を作る。KMP 版（0.3.9）を開き、手元 Worker の写真が一覧に出るところまで使う
- launchApp:
    clearState: true
    permissions:
      all: allow
# KMP 版は「取り込み」タブで開く（App.kt の startDestination = "browser"）。写真タブへ移ってから一覧を見る
# 案内は背面のタブより少し遅れて出る。「写真」が先に見えた時点で進むと案内が残り、タップが背面に届かない。
# エミュレータは画面ロックが無いので案内は必ず出る。案内のボタンを待ってから閉じる
- extendedWaitUntil:
    visible: "ロックなしで続ける"
    timeout: 60000
- tapOn: "ロックなしで続ける"
- extendedWaitUntil:
    visible: "写真"
    timeout: 30000
- tapOn: "写真"
# KMP 版のタイルは名前を読み上げに持つので、名前で一覧に出たことを見る
- extendedWaitUntil:
    visible: "seed-photo\\.jpg"
    timeout: 30000
- assertNotVisible: "アクセストークン"
- stopApp
