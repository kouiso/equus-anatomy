appId: app.r2gallery
---
# 動画を開くと再生が始まること。「一時停止」が出る＝プレイヤーが再生中の状態
- launchApp
- extendedWaitUntil:
    visible: "seed-clip.mp4"
    timeout: 30000
- tapOn: "seed-clip.mp4"
- extendedWaitUntil:
    visible: ".*件目 · seed-clip.mp4"
    timeout: 15000
# 操作バーは数秒で隠れるので、見えていなければ画面を1回押して出す
- runFlow:
    when:
      notVisible: "一時停止"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    visible: "一時停止"
    timeout: 20000
- assertNotVisible: "再生できませんでした"
- tapOn: "閉じる"
- extendedWaitUntil:
    visible: "seed-photo.jpg"
    timeout: 15000
