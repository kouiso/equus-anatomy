<title>EQUUS 座標採取</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0b0c0e; --surface:#14161a; --raised:#1e2126; --line:#262a30; --line-strong:#3a4048;
    --fg:#ece7dd; --muted:#9aa2ac; --faint:#6b737d; --bone:#ddcba4; --accent-fg:#17140d;
    --good:#5fc08e; --bad:#e4726a;
    --display:"Cormorant Garamond","Times New Roman",serif;
    --sans:"Zen Kaku Gothic New",ui-sans-serif,system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;
       height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:baseline;gap:10px;padding:10px 16px 8px;border-bottom:1px solid var(--line);flex:none}
  header h1{margin:0;font-size:16px;font-weight:500;letter-spacing:.02em}
  header .brand{font-family:var(--display);font-style:italic;font-size:13px;letter-spacing:.28em;color:var(--muted)}
  header .status{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  @media(min-width:900px){main{flex-direction:row}}
  #stage{position:relative;flex:1;min-height:44dvh;background:var(--bg);overflow:hidden}
  @media(min-width:900px){#stage{min-height:0}}
  svg{display:block;width:100%;height:100%;touch-action:none;user-select:none}
  #panel{flex:none;max-height:52dvh;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line);
         padding:10px 14px 24px;display:flex;flex-direction:column;gap:10px}
  @media(min-width:900px){#panel{width:380px;max-height:none;height:100%;border-top:0;border-left:1px solid var(--line)}}
  /* 縦の flex では中身が溢れると子が縮む。チップの高さが 34px から潰れるので明示的に止める。 */
  #panel>*{flex:none}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
  .chips button{flex:none;height:34px;padding:0 13px;border:0;border-radius:999px;background:var(--raised);
                color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
  .chips button[aria-pressed="true"]{background:var(--bone);color:var(--accent-fg)}
  .chips button:disabled{opacity:.35;cursor:not-allowed}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--faint)}
  select{height:42px;border:0;border-radius:10px;background:var(--raised);color:var(--fg);font:inherit;font-size:14px;padding:0 10px}
  .row{display:flex;gap:8px}
  .row>button{flex:1}
  button.act{height:42px;border:0;border-radius:999px;background:var(--raised);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
  button.act.primary{background:var(--bone);color:var(--accent-fg);font-weight:700}
  button.act:disabled{opacity:.35;cursor:not-allowed}
  .hint{font-size:12.5px;line-height:1.7;color:var(--muted);margin:0}
  .note{font-size:12px;line-height:1.6;color:var(--fg);background:var(--raised);border-radius:10px;padding:9px 11px;margin:0}
  .note.err{color:var(--bad)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  li .k{flex:none;width:34px;font-size:11px;color:var(--faint)}
  li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li .c{flex:none;font-size:11px;color:var(--faint);font-family:var(--mono)}
  li button{flex:none;border:0;border-radius:999px;background:var(--raised);color:var(--muted);font:inherit;font-size:11px;padding:5px 9px;cursor:pointer}
  #tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
  #tools button{width:40px;height:40px;border:0;border-radius:999px;background:rgba(30,33,38,.92);color:var(--fg);
                font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center}
  #banner{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:92%;
          background:rgba(30,33,38,.94);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--muted);
          pointer-events:none;text-align:center}
  :focus-visible{outline:2px solid var(--bone);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <h1>座標採取</h1><span class="brand">EQUUS</span><span class="status" id="sync">起動中…</span>
</header>
<main>
  <div id="stage">
    <svg id="svg" preserveAspectRatio="xMidYMid meet" aria-label="馬体図"></svg>
    <div id="tools">
      <button id="zin" aria-label="拡大">＋</button>
      <button id="zout" aria-label="縮小">−</button>
      <button id="zreset" aria-label="全体に戻る">⟲</button>
    </div>
    <div id="banner"></div>
  </div>
  <div id="panel">
    <div class="chips" id="views" role="group" aria-label="向き"></div>
    <div class="chips" id="layers" role="group" aria-label="層"></div>
    <div class="chips" id="kinds" role="group" aria-label="種類"></div>
    <label class="field">なぞる対象
      <select id="target"></select>
    </label>
    <p class="hint">図をタップして輪郭の頂点を置く。置いた点をもう一度タップすると消える。2本指で拡大、1本指ドラッグで移動。3点以上で確定できる。</p>
    <div class="row">
      <button class="act primary" id="commit" disabled>確定</button>
      <button class="act" id="undo" disabled>1つ戻す</button>
    </div>
    <button class="act" id="copy">JSON をコピー</button>
    <p class="note" id="msg" hidden></p>
    <p class="hint" id="count"></p>
    <ul id="list"></ul>
  </div>
</main>
